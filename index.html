<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Universe Ledger</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0a0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#0a0a0c;
    --bg-panel:#151319;
    --bg-raised:#1d1a22;
    --bg-bar:#111015;
    --gold:#c9a227;
    --gold-bright:#f0d480;
    --crimson:#b91d3d;
    --crimson-bright:#e8496b;
    --steel:#3d3a44;
    --steel-light:#565160;
    --text:#f2efe6;
    --text-dim:#9b96a3;
    --green:#4f9d69;
    --topbar-h:58px;
    --bottombar-h:66px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg-void);color:var(--text);font-family:'Inter',sans-serif;overscroll-behavior-y:none;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(201,162,39,0.10), transparent),
      radial-gradient(ellipse 700px 400px at 90% 100%, rgba(185,29,61,0.08), transparent),
      var(--bg-void);
    min-height:100vh;
  }
  ::selection{background:var(--gold);color:#100e14;}

  /* ---- App shell ---- */
  .app-shell{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-top:var(--topbar-h);padding-bottom:calc(var(--bottombar-h) + 14px);}

  .topbar{
    position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;height:var(--topbar-h);
    background:linear-gradient(180deg,rgba(17,16,21,.97),rgba(17,16,21,.92));backdrop-filter:blur(6px);
    border-bottom:1px solid var(--steel);z-index:40;
    display:flex;align-items:center;justify-content:space-between;padding:0 16px;
  }
  .topbar-brand{display:flex;align-items:center;gap:9px;}
  .app-icon{
    width:30px;height:30px;border-radius:8px;flex-shrink:0;
    background:linear-gradient(160deg,var(--gold-bright),var(--gold) 55%,#8a6c17);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(201,162,39,.35);
  }
  .app-icon svg{width:17px;height:17px;fill:#100e14;}
  .topbar-title{font-family:'Oswald',sans-serif;font-weight:600;font-size:16px;letter-spacing:.02em;text-transform:uppercase;}
  .topbar-title small{display:block;font-family:'Inter',sans-serif;font-size:9.5px;color:var(--text-dim);letter-spacing:.08em;text-transform:none;font-weight:400;margin-top:1px;}
  .save-indicator{display:flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--text-dim);letter-spacing:.04em;}
  .save-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(79,157,105,.5);transition:background .2s;}
  .save-dot.saving{background:var(--gold);animation:pulse 1s infinite;}
  .save-btn{
    display:flex;align-items:center;gap:6px;background:var(--bg-raised);border:1px solid var(--steel);color:var(--text);
    font-family:'Inter',sans-serif;font-size:11.5px;font-weight:600;border-radius:7px;padding:7px 11px;cursor:pointer;
  }
  .save-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
  .save-btn:active{transform:scale(.96);}
  .save-btn.just-saved{border-color:var(--green);color:var(--green);}
  .edit-icon-btn{background:none;border:1px solid var(--steel);color:var(--text-dim);border-radius:6px;padding:5px 8px;cursor:pointer;display:flex;align-items:center;}
  .edit-icon-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;}
  .edit-icon-btn:hover{color:var(--gold);border-color:var(--gold);}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,162,39,.5);}70%{box-shadow:0 0 0 6px rgba(201,162,39,0);}100%{box-shadow:0 0 0 0 rgba(201,162,39,0);}}

  main.app-main{padding:18px 16px 4px;}

  .page-head{margin-bottom:18px;}
  .page-head h2{font-family:'Oswald',sans-serif;font-size:21px;text-transform:uppercase;letter-spacing:.05em;margin:0;}
  .page-head p{color:var(--text-dim);font-size:12.5px;margin:3px 0 0;}

  .bottomnav{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;height:var(--bottombar-h);
    background:linear-gradient(0deg,rgba(17,16,21,.98),rgba(17,16,21,.90));backdrop-filter:blur(6px);
    border-top:1px solid var(--steel);z-index:40;
    display:flex;padding-bottom:env(safe-area-inset-bottom,0);
  }
  .bottomnav button{
    flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--text-dim);cursor:pointer;padding:8px 4px 6px;position:relative;
  }
  .bottomnav button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;}
  .bottomnav button span{font-size:10px;font-weight:600;letter-spacing:.01em;}
  .bottomnav button.active{color:var(--gold);}
  .bottomnav button.active svg{fill:var(--gold);stroke:var(--gold);}
  .bottomnav button.active::before{
    content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:2.5px;border-radius:2px;background:var(--gold);
  }

  section{display:none;}
  section.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .empty{text-align:center;padding:50px 18px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:12.5px;border:1px dashed var(--steel);border-radius:10px;}
  .empty b{color:var(--gold);}

  /* ---- Champion belt cards ---- */
  .belt-grid{display:flex;flex-direction:column;gap:16px;}
  .belt-card{
    position:relative;background:linear-gradient(160deg,var(--bg-raised),#100e14);
    border:2px solid var(--gold);padding:22px 20px 18px;border-radius:14px;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
  }
  .belt-card.vacant{border-color:var(--crimson);}
  .belt-card::before{
    content:"";position:absolute;top:0;left:18px;right:18px;height:3px;border-radius:0 0 3px 3px;
    background:linear-gradient(90deg,transparent,var(--gold-bright),transparent);
  }
  .belt-card.vacant::before{background:linear-gradient(90deg,transparent,var(--crimson-bright),transparent);}
  .belt-title{font-family:'Oswald',sans-serif;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:0 0 5px;}
  .belt-card.vacant .belt-title{color:var(--crimson-bright);}
  .champ-name{font-family:'Oswald',sans-serif;font-size:23px;font-weight:600;margin:0 0 12px;line-height:1.1;}
  .vacant-label{color:var(--text-dim);font-style:italic;font-weight:400;font-size:18px;}
  .belt-stats{display:flex;gap:20px;margin-bottom:14px;}
  .belt-stat b{display:block;font-family:'JetBrains Mono',monospace;font-size:20px;color:var(--text);}
  .belt-stat span{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-dim);}
  .feud-block{background:var(--bg-panel);border:1px solid var(--steel);border-radius:8px;padding:10px 12px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .feud-label{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin-bottom:2px;}
  .feud-name{font-family:'Oswald',sans-serif;font-size:15px;color:var(--crimson-bright);}
  .feud-name.none{color:var(--text-dim);font-style:italic;font-family:'Inter',sans-serif;font-size:13px;}
  .defense-log{border-top:1px solid var(--steel);padding-top:10px;margin-bottom:14px;max-height:100px;overflow-y:auto;}
  .defense-log-title{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px;}
  .defense-row{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;color:var(--text-dim);font-family:'JetBrains Mono',monospace;}
  .defense-row b{color:var(--text);font-family:'Inter',sans-serif;font-weight:500;}
  .belt-actions{display:flex;gap:8px;flex-wrap:wrap;}

  button.btn{
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.02em;
    background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:7px;
    padding:9px 14px;cursor:pointer;transition:all .15s;
  }
  button.btn:active{transform:scale(.97);}
  button.btn:hover{background:var(--gold);color:#100e14;}
  button.btn.crimson{color:var(--crimson-bright);border-color:var(--crimson-bright);}
  button.btn.crimson:hover{background:var(--crimson-bright);color:#100e14;}
  button.btn.ghost{color:var(--text-dim);border-color:var(--steel);}
  button.btn.ghost:hover{background:var(--steel);color:var(--text);}
  button.btn.solid{background:var(--gold);color:#100e14;}
  button.btn.solid:hover{background:var(--gold-bright);}
  button.btn.small{padding:6px 11px;font-size:11.5px;border-radius:6px;}

  /* ---- Superstars ranking ---- */
  .rank-list{display:flex;flex-direction:column;gap:10px;}
  .rank-row{
    display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;
    background:var(--bg-panel);border:1px solid var(--steel);border-radius:10px;padding:13px 14px;
  }
  .rank-row.hot{border-color:var(--gold);}
  .rank-num{font-family:'JetBrains Mono',monospace;font-size:15px;color:var(--text-dim);text-align:center;}
  .rank-row.hot .rank-num{color:var(--gold);font-weight:700;}
  .rank-name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .rank-name{font-family:'Oswald',sans-serif;font-size:16px;font-weight:500;}
  .brand-tag{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);border:1px solid var(--steel);border-radius:3px;padding:1px 6px;}
  .badge{font-size:9px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;border-radius:3px;padding:2px 6px;}
  .badge.contender{background:var(--gold);color:#100e14;}
  .badge.streak-w{background:rgba(79,157,105,.18);color:var(--green);border:1px solid var(--green);}
  .badge.streak-l{background:rgba(185,29,61,.15);color:var(--crimson-bright);border:1px solid var(--crimson-bright);}
  .momentum-bar-wrap{margin-top:7px;height:6px;background:var(--steel);border-radius:3px;overflow:hidden;width:100%;max-width:210px;}
  .momentum-bar{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--crimson-bright),var(--gold) 55%,var(--green));}
  .rank-meta{text-align:right;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--text-dim);}
  .rank-meta b{color:var(--text);font-size:17px;display:block;}

  /* ---- Management page ---- */
  .card-block{background:var(--bg-panel);border:1px solid var(--steel);border-radius:10px;padding:16px;margin-bottom:16px;}
  .card-block h3{font-family:'Oswald',sans-serif;font-size:14px;text-transform:uppercase;letter-spacing:.07em;margin:0 0 4px;color:var(--gold);}
  .card-block .hint{color:var(--text-dim);font-size:11.5px;margin:0 0 12px;}
  .form-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  input[type=text],input[type=date],input[type=number],select{
    background:var(--bg-raised);border:1px solid var(--steel);color:var(--text);
    padding:10px 11px;border-radius:7px;font-family:'Inter',sans-serif;font-size:14px;flex:1;min-width:100px;
    -webkit-appearance:none;
  }
  input[type=text]:focus,input[type=date]:focus,input[type=number]:focus,select:focus{outline:none;border-color:var(--gold);}
  .list-line{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bg-raised);font-size:13.5px;}
  .list-line:last-child{border-bottom:none;}
  .list-line .rec{color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:11px;display:flex;align-items:center;gap:6px;}
  .mini-x{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;}
  .mini-x:hover{color:var(--crimson-bright);}

  /* ---- Modal ---- */
  .modal-bg{position:fixed;inset:0;background:rgba(5,4,6,.75);backdrop-filter:blur(2px);display:none;align-items:flex-end;justify-content:center;z-index:80;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--bg-panel);border:1px solid var(--gold);border-top-left-radius:16px;border-top-right-radius:16px;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0));width:100%;max-width:520px;}
  .modal h3{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:15px;margin:0 0 14px;color:var(--gold-bright);}
  .modal label{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);margin:12px 0 5px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}

  .toast{position:fixed;bottom:calc(var(--bottombar-h) + 14px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--gold);color:#100e14;font-weight:600;font-size:13px;padding:10px 20px;border-radius:8px;opacity:0;transition:all .25s;z-index:90;pointer-events:none;box-shadow:0 6px 16px rgba(0,0,0,.4);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:14px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;letter-spacing:.08em;font-size:12px;}
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--steel);border-top-color:var(--gold);animation:spin 0.9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .bottomnav button span{font-size:9.5px;}
  .head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .sub-members{display:block;font-family:'Inter',sans-serif;font-size:12px;font-weight:400;color:var(--text-dim);margin-top:3px;letter-spacing:0;}
  .badge.tag{background:rgba(201,162,39,.16);color:var(--gold-bright);border:1px solid var(--gold);}
  .heat-tag{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--crimson-bright);border:1px solid var(--crimson-bright);border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:middle;}
  .team-card,.rival-card{background:var(--bg-panel);border:1px solid var(--steel);border-radius:12px;padding:14px 15px;margin-bottom:12px;}
  .team-card.hot{border-color:var(--gold);}
  .team-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .team-name{font-family:'Oswald',sans-serif;font-size:18px;font-weight:500;}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
  .card-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center;}
  .seg{display:flex;background:var(--bg-panel);border:1px solid var(--steel);border-radius:9px;padding:3px;margin-bottom:16px;}
  .seg button{flex:1;background:none;border:none;color:var(--text-dim);font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;padding:9px 6px;border-radius:7px;cursor:pointer;}
  .seg button.active{background:var(--gold);color:#100e14;}
  .rival-top{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;text-align:center;}
  .rival-name{font-family:'Oswald',sans-serif;font-size:17px;font-weight:500;}
  .rival-name small{display:block;font-family:'Inter',sans-serif;font-size:10.5px;color:var(--text-dim);font-weight:400;}
  .vs{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--crimson-bright);border:1px solid var(--crimson-bright);border-radius:4px;padding:2px 6px;}
  .heat-row{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0 8px;}
  .pips{display:flex;gap:3px;}
  .pip{width:20px;height:6px;border-radius:2px;background:var(--steel);}
  .pip.on{background:linear-gradient(90deg,var(--gold),var(--crimson-bright));}
  .heat-label{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);}
  .h2h{text-align:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text);}
  .h2h span{color:var(--text-dim);}
  .rival-note{text-align:center;font-size:12.5px;color:var(--text-dim);margin-top:8px;font-style:italic;}
  .rival-card .card-actions{justify-content:center;}
  .tip{background:var(--bg-panel);border:1px solid var(--steel);border-left:4px solid var(--steel-light);border-radius:10px;padding:13px 14px;margin-bottom:11px;}
  .tip.p1{border-left-color:var(--gold);}
  .tip.p2{border-left-color:var(--crimson-bright);}
  .tip-pri{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);margin-bottom:4px;font-weight:700;}
  .tip.p1 .tip-pri{color:var(--gold);}
  .tip.p2 .tip-pri{color:var(--crimson-bright);}
  .tip-title{font-family:'Oswald',sans-serif;font-size:15px;font-weight:500;margin-bottom:4px;}
  .tip-text{font-size:13px;color:var(--text-dim);line-height:1.5;}
  .tip .btn{margin-top:10px;}
  .note-box{font-size:11.5px;color:var(--text-dim);background:var(--bg-raised);border-radius:8px;padding:9px 11px;margin-bottom:14px;line-height:1.5;}
</style>
</head>
<body>
<div id="root"><div class="loading"><div class="spinner"></div>ADATOK BETÖLTÉSE…</div></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script>
const STORE_KEY = 'universe-ledger-data';
const EXPORT_KEY = 'universe-ledger-last-export';
const Store = {
  async get(key){ const v = localStorage.getItem(key); return v ? { key, value: v } : null; },
  async set(key, value){ localStorage.setItem(key, value); return { key, value }; }
};
if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }
let state = { titles: [], wrestlers: [], teams: [], rivalries: [] };
let activeTab = 'champions';

const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtDate = (iso) => { const d = new Date(iso+'T00:00:00'); return d.toLocaleDateString('hu-HU',{year:'numeric',month:'short',day:'numeric'}); };
const daysBetween = (iso) => Math.max(0, Math.floor((Date.now() - new Date(iso+'T00:00:00').getTime()) / 86400000));

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}
function setSaveDot(saving){
  const d = document.getElementById('saveDot');
  const l = document.getElementById('saveLabel');
  if(!d) return;
  d.classList.toggle('saving', saving);
  if(l) l.textContent = saving ? 'Mentés…' : 'Mentve';
}

async function loadState(){
  try{
    const res = await Store.get(STORE_KEY);
    if(res && res.value) state = JSON.parse(res.value);
  }catch(e){ /* nincs még mentett adat */ }
  normalizeState();
  // backward-compat defaults
  state.titles.forEach(t => { if(t.feudId === undefined) t.feudId = null; if(!t.defenses) t.defenses = []; if(t.defenseCount === undefined) t.defenseCount = t.defenses.length; });
  state.wrestlers.forEach(w => { if(!w.history) w.history = []; });
  render();
}
let saveTimer = null;
async function saveState(){
  setSaveDot(true);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try{ await Store.set(STORE_KEY, JSON.stringify(state)); setSaveDot(false); }
    catch(e){ console.error('Mentési hiba', e); showToast('⚠ Mentés sikertelen — próbáld újra'); setSaveDot(false); }
  }, 250);
}

// ---------- Momentum / streak calculations ----------
function streakOf(w){
  const h = w.history || [];
  if(h.length === 0) return 0;
  const last = h[h.length-1].result;
  let count = 0;
  for(let i=h.length-1;i>=0;i--){ if(h[i].result === last) count++; else break; }
  return last === 'W' ? count : -count;
}
function momentumOf(w){
  const h = (w.history || []).slice(-6);
  let score = 50;
  h.forEach((entry, i) => {
    const weight = i + 1;
    if(entry.result === 'W') score += weight * (entry.title ? 3 : 2);
    else score -= weight * (entry.title ? 2 : 1.4);
  });
  return Math.max(0, Math.min(100, Math.round(score)));
}
function isChampion(wid){ return state.titles.some(t => t.championId === wid); }

function lastExportLabel(){
  let d = null;
  try{ d = localStorage.getItem(EXPORT_KEY); }catch(e){}
  return d ? fmtDate(d) : 'még nem volt';
}

async function exportBackup(){
  const text = JSON.stringify({ app:'universe-ledger', version:1, exportedAt:new Date().toISOString(), state }, null, 2);
  const fileName = `universe-ledger-backup-${todayISO()}.json`;
  const file = new File([text], fileName, { type:'application/json' });
  try{
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:'Universe Ledger mentés' });
    }else{
      const url = URL.createObjectURL(file);
      const a = document.createElement('a');
      a.href = url; a.download = fileName;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 1500);
    }
    try{ localStorage.setItem(EXPORT_KEY, todayISO()); }catch(e){}
    showToast('Biztonsági mentés kész ✓');
    render();
  }catch(e){
    if(e && e.name === 'AbortError') return;
    showToast('⚠ Az exportálás nem sikerült');
  }
}

function importBackup(ev){
  const f = ev.target.files && ev.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      const st = data && data.state ? data.state : data;
      if(!st || !Array.isArray(st.titles) || !Array.isArray(st.wrestlers)) throw new Error('bad');
      if(!confirm('Ez felülírja a jelenlegi adatokat a fájl tartalmával. Folytatod?')) return;
      state = st; normalizeState();
      state.titles.forEach(t => { if(t.feudId === undefined) t.feudId = null; if(!t.defenses) t.defenses = []; if(t.defenseCount === undefined) t.defenseCount = t.defenses.length; });
      state.wrestlers.forEach(w => { if(!w.history) w.history = []; });
      saveState(); render(); showToast('Mentés visszatöltve ✓');
    }catch(e){ showToast('⚠ Hibás vagy nem megfelelő fájl'); }
  };
  reader.readAsText(f);
  ev.target.value = '';
}

async function manualSave(){
  clearTimeout(saveTimer);
  setSaveDot(true);
  try{
    await Store.set(STORE_KEY, JSON.stringify(state));
    setSaveDot(false);
    const b = document.getElementById("manualSave");
    if(b){ b.classList.add("just-saved"); setTimeout(()=>b.classList.remove("just-saved"),1500); }
    showToast("Mentve ✓");
  }catch(e){ setSaveDot(false); showToast("⚠ Mentés sikertelen"); }
}

function renderRanking(){
  const contenders = state.wrestlers.filter(w => !isChampion(w.id));
  const head = `<div class="page-head"><h2>Szupersztárok</h2><p>Momentum és széria a legutóbbi meccsek alapján — minél magasabb, annál inkább esedékes egy cím­meccs</p></div>`;
  if(contenders.length === 0){
    return head + `<div class="empty">Nincs kihívó a listán.<br>Vegyél fel versenyzőket a <b>Kezelés</b> oldalon.</div>`;
  }
  const scored = contenders.map(w => ({
    w, momentum: momentumOf(w), streak: streakOf(w),
    wins: (w.history||[]).filter(h=>h.result==='W').length,
    losses: (w.history||[]).filter(h=>h.result==='L').length,
  })).sort((a,b) => b.momentum - a.momentum);

  const rows = scored.map((s,i) => {
    const hot = s.momentum >= 65 && s.streak >= 2;
    const streakBadge = s.streak > 0
      ? `<span class="badge streak-w">${s.streak} győzelmi szériában</span>`
      : s.streak < 0
        ? `<span class="badge streak-l">${Math.abs(s.streak)} vereség sorban</span>`
        : '';
    return `
    <div class="rank-row ${hot?'hot':''}">
      <div class="rank-num">${i+1}</div>
      <div>
        <div class="rank-name-row">
          <span class="rank-name">${escapeHtml(s.w.name)}</span>
          ${s.w.brand ? `<span class="brand-tag">${escapeHtml(s.w.brand)}</span>` : ''}
          ${tagChampBadge(s.w.id)}
          ${hot ? '<span class="badge contender">Cím­meccset érdemel</span>' : ''}
          ${streakBadge}
        </div>
        <div class="momentum-bar-wrap"><div class="momentum-bar" style="width:${s.momentum}%"></div></div>
      </div>
      <div class="rank-meta"><b>${s.momentum}</b>${s.wins}GY–${s.losses}V</div>
    </div>`;
  }).join('');
  return head + `<div class="rank-list">${rows}</div>`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- Event binding ----------
function bindTabs(){
  document.querySelectorAll('.bottomnav button').forEach(btn=>{
    btn.onclick = () => { activeTab = btn.dataset.tab; render(); };
  });
}

function bindChampionActions(){
  document.querySelectorAll('[data-crown]').forEach(btn=>{ btn.onclick = () => openCrownModal(btn.dataset.crown); });
  document.querySelectorAll('[data-defend]').forEach(btn=>{ btn.onclick = () => openDefendModal(btn.dataset.defend); });
  document.querySelectorAll('[data-lose]').forEach(btn=>{ btn.onclick = () => openLoseModal(btn.dataset.lose); });
  document.querySelectorAll('[data-edit]').forEach(btn=>{ btn.onclick = () => openEditModal(btn.dataset.edit); });
  document.querySelectorAll('[data-feud]').forEach(btn=>{ btn.onclick = () => openFeudModal(btn.dataset.feud); });
  document.querySelectorAll('[data-delete-title]').forEach(btn=>{
    btn.onclick = () => {
      if(confirm('Biztosan törlöd ezt az övet?')){
        state.titles = state.titles.filter(t=>t.id !== btn.dataset.deleteTitle);
        saveState(); render();
      }
    };
  });
}

function bindRosterActions(){
  const addW = document.getElementById('addWrestlerBtn');
  if(addW) addW.onclick = () => {
    const nameEl = document.getElementById('newWrestlerName');
    const brandEl = document.getElementById('newWrestlerBrand');
    const name = nameEl.value.trim();
    if(!name){ showToast('Adj meg egy nevet'); return; }
    state.wrestlers.push({ id: uid(), name, brand: brandEl.value.trim(), history: [] });
    saveState(); render(); showToast(`${name} hozzáadva`);
  };
  const addT = document.getElementById('addTitleBtn');
  if(addT) addT.onclick = () => {
    const nameEl = document.getElementById('newTitleName');
    const name = nameEl.value.trim();
    if(!name){ showToast('Adj meg egy öv nevet'); return; }
    state.titles.push({ id: uid(), name, kind: document.getElementById('newTitleKind').value, championId: null, since: null, defenses: [], defenseCount: 0, feudId: null });
    saveState(); render(); showToast(`${name} felvéve`);
  };
  document.querySelectorAll('[data-del-wrestler]').forEach(btn=>{
    btn.onclick = () => {
      const id = btn.dataset.delWrestler;
      if(confirm('Biztosan törlöd ezt a versenyzőt? A csapatai és rivalizálásai is törlődnek.')){
        removeWrestlerCascade(id);
        state.titles.forEach(t=>{
          if(t.championId===id){ t.championId=null; t.since=null; }
          if(t.feudId===id){ t.feudId=null; }
        });
        saveState(); render();
      }
    };
  });
  document.querySelectorAll('[data-del-title]').forEach(btn=>{
    btn.onclick = () => {
      if(confirm('Biztosan törlöd ezt az övet?')){
        state.titles = state.titles.filter(t=>t.id!==btn.dataset.delTitle);
        saveState(); render();
      }
    };
  });
  const logMatch = document.getElementById('logMatchBtn');
  if(logMatch) logMatch.onclick = () => {
    const wId = document.getElementById('matchWinner').value;
    const lId = document.getElementById('matchLoser').value;
    if(!wId || !lId || wId === lId){ showToast('Válassz két különböző versenyzőt'); return; }
    const winner = getEntity(wId);
    const loser = getEntity(lId);
    winner.history.push({ date: todayISO(), result:'W', title:false });
    loser.history.push({ date: todayISO(), result:'L', title:false });
    recordRivalryResult(winner.id, loser.id);
    saveState(); render(); showToast(`${winner.name} győzött ${loser.name} ellen`);
  };
}

// ---------- Modals ----------
function openModal(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalBg').classList.add('show');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('show'); }
document.getElementById('modalBg').addEventListener('click', (e)=>{ if(e.target.id==='modalBg') closeModal(); });

function opponentOptions(excludeId){
  return state.wrestlers.filter(w=>w.id!==excludeId).map(w=>`<option value="${w.id}">${escapeHtml(w.name)}</option>`).join('');
}

function openCrownModal(titleId){
  const title = state.titles.find(t=>t.id===titleId);
  if(!optionsFor(title,null)){ showToast(title.kind==='tag'?'Előbb vegyél fel csapatot':'Először vegyél fel versenyzőket'); return; }
  openModal(`
    <h3>Bajnok kinevezése — ${escapeHtml(title.name)}</h3>
    <label>Új bajnok</label>
    <select id="crownSelect">${optionsFor(title,null)}</select>
    <label>Bajnok ez óta (dátum)</label>
    <input type="date" id="crownDate" value="${todayISO()}" style="width:100%">
    <label>Eddigi cím­védések száma</label>
    <input type="number" id="crownDefs" min="0" value="0" style="width:100%">
    <div class="modal-actions">
      <button class="btn ghost" id="modalCancel">Mégse</button>
      <button class="btn solid" id="modalConfirm">Kikiáltás</button>
    </div>
  `);
  document.getElementById('modalCancel').onclick = closeModal;
  document.getElementById('modalConfirm').onclick = () => {
    const wid = document.getElementById('crownSelect').value;
    const w = getEntity(wid);
    title.championId = wid;
    title.since = document.getElementById("crownDate").value || todayISO();
    title.defenses = [];
    title.defenseCount = Math.max(0, parseInt(document.getElementById("crownDefs").value) || 0);
    title.feudId = null;
    w.history.push({ date: todayISO(), result:'W', title:true });
    saveState(); closeModal(); render();
    showToast(`${w.name} az új bajnok!`);
  };
}

function openDefendModal(titleId){
  const title = state.titles.find(t=>t.id===titleId);
  const opts = optionsFor(title, title.championId);
  if(!opts){ showToast('Nincs elérhető kihívó'); return; }
  openModal(`
    <h3>Cím­védés — ${escapeHtml(title.name)}</h3>
    <label>Kihívó</label>
    <select id="defendSelect">${opts}</select>
    <div class="modal-actions">
      <button class="btn ghost" id="modalCancel">Mégse</button>
      <button class="btn solid" id="modalConfirm">Védés rögzítése</button>
    </div>
  `);
  document.getElementById('modalCancel').onclick = closeModal;
  document.getElementById('modalConfirm').onclick = () => {
    const oppId = document.getElementById('defendSelect').value;
    const opp = getEntity(oppId);
    const champ = getEntity(title.championId);
    title.defenses.push({ id: uid(), date: todayISO(), opponentId: oppId, opponentName: opp.name });
    title.defenseCount = (title.defenseCount ?? title.defenses.length - 1) + 1;
    recordRivalryResult(champ.id, opp.id);
    champ.history.push({ date: todayISO(), result:'W', title:true });
    opp.history.push({ date: todayISO(), result:'L', title:true });

// ===================== Teams / Rivalries / Story advisor =====================
let storySub = 'rivals';
let currentTips = [];

function normalizeState(){
  if(!state || typeof state !== 'object') state = { titles: [], wrestlers: [] };
  state.titles = state.titles || []; state.wrestlers = state.wrestlers || [];
  state.teams = state.teams || []; state.rivalries = state.rivalries || [];
  state.titles.forEach(t => { if(!t.kind) t.kind = 'singles'; });
  state.teams.forEach(t => { if(!t.history) t.history = []; if(!t.memberIds) t.memberIds = []; });
  state.rivalries.forEach(r => { if(!r.matches) r.matches = []; if(!r.heat) r.heat = 3; if(r.note === undefined) r.note = ''; });
}
function getEntity(id){ return state.wrestlers.find(w => w.id === id) || state.teams.find(t => t.id === id) || null; }
function membersLine(e){
  if(!e || !e.memberIds) return '';
  const names = e.memberIds.map(id => { const w = state.wrestlers.find(x => x.id === id); return w ? w.name : null; }).filter(Boolean);
  return names.length ? `<span class="sub-members">${names.map(escapeHtml).join(' &amp; ')}</span>` : '';
}
function optionsFor(title, excludeId){
  const pool = title.kind === 'tag' ? state.teams : state.wrestlers;
  return pool.filter(x => x.id !== excludeId).map(x => `<option value="${x.id}">${escapeHtml(x.name)}</option>`).join('');
}
function allEntityOptions(){
  const w = state.wrestlers.map(x => `<option value="${x.id}">${escapeHtml(x.name)}</option>`).join('');
  const t = state.teams.map(x => `<option value="${x.id}">${escapeHtml(x.name)}</option>`).join('');
  return (w ? `<optgroup label="Versenyzők">${w}</optgroup>` : '') + (t ? `<optgroup label="Csapatok">${t}</optgroup>` : '');
}
function recordOf(e){
  const h = e.history || [];
  return { w: h.filter(x => x.result === 'W').length, l: h.filter(x => x.result === 'L').length };
}
function titlesHeld(id){ return state.titles.filter(t => t.championId === id); }

function findRivalry(aId, bId){ return state.rivalries.find(r => (r.aId === aId && r.bId === bId) || (r.aId === bId && r.bId === aId)); }
function ensureRivalry(aId, bId, heat = 3){
  let r = findRivalry(aId, bId);
  if(!r){ r = { id: uid(), aId, bId, heat, note: '', since: todayISO(), matches: [] }; state.rivalries.push(r); }
  return r;
}
function recordRivalryResult(winnerId, loserId){
  const r = findRivalry(winnerId, loserId);
  if(r) r.matches.push({ date: todayISO(), winnerId });
}
function heatBadge(aId, bId){ const r = findRivalry(aId, bId); return r ? `<span class="heat-tag">HEAT ${r.heat}/5</span>` : ''; }
function tagChampBadge(wid){
  const yes = state.teams.some(t => t.memberIds.includes(wid) && state.titles.some(x => x.kind === 'tag' && x.championId === t.id));
  return yes ? '<span class="badge tag">Tag bajnok</span>' : '';
}
function removeTeamCascade(id){
  state.teams = state.teams.filter(t => t.id !== id);
  state.titles.forEach(t => {
    if(t.championId === id){ t.championId = null; t.since = null; t.defenseCount = 0; t.defenses = []; }
    if(t.feudId === id) t.feudId = null;
  });
  state.rivalries = state.rivalries.filter(r => r.aId !== id && r.bId !== id);
}
function removeWrestlerCascade(id){
  state.teams.filter(t => t.memberIds.includes(id)).forEach(t => removeTeamCascade(t.id));
  state.wrestlers = state.wrestlers.filter(w => w.id !== id);
  state.rivalries = state.rivalries.filter(r => r.aId !== id && r.bId !== id);
}

// ---------- Teams page ----------
function renderTeams(){
  const head = `<div class="page-head head-row"><div><h2>Csapatok</h2><p>Tag teamek és stable-ök a tag címekhez</p></div><button class="btn solid" data-new-team>+ Új csapat</button></div>`;
  if(state.teams.length === 0){
    return head + `<div class="empty">Még nincs csapat.<br>Koppints az <b>+ Új csapat</b> gombra, és add meg a tagokat.<br><br>Tag címhez a <b>Kezelés</b> oldalon válaszd a „Tag Team" típust.</div>`;
  }
  const rows = state.teams.map(t => ({ t, m: momentumOf(t), s: streakOf(t), r: recordOf(t), titles: titlesHeld(t.id).filter(x => x.kind === 'tag') }))
    .sort((a, b) => b.m - a.m).map(x => {
      const hot = x.m >= 65 && x.s >= 2 && x.titles.length === 0;
      const streakBadge = x.s > 0 ? `<span class="badge streak-w">${x.s} győzelmi szériában</span>` : x.s < 0 ? `<span class="badge streak-l">${Math.abs(x.s)} vereség sorban</span>` : '';
      return `<div class="team-card ${hot ? 'hot' : ''}">
        <div class="team-top">
          <div><div class="team-name">${escapeHtml(x.t.name)}</div>${membersLine(x.t)}</div>
          <div class="rank-meta"><b>${x.m}</b>${x.r.w}GY–${x.r.l}V</div>
        </div>
        <div class="momentum-bar-wrap"><div class="momentum-bar" style="width:${x.m}%"></div></div>
        <div class="badges">
          ${x.titles.map(tt => `<span class="badge contender">★ ${escapeHtml(tt.name)}</span>`).join('')}
          ${hot ? '<span class="badge contender">Címmeccset érdemel</span>' : ''}
          ${streakBadge}
        </div>
        <div class="card-actions">
          <button class="btn ghost small" data-team-edit="${x.t.id}">Szerkesztés</button>
          <button class="btn ghost small" data-team-del="${x.t.id}">Törlés</button>
        </div>
      </div>`;
    }).join('');
  return head + rows;
}

// ---------- Story advisor (rule-based) ----------
function computeTips(){
  const tips = [];
  const add = (pri, title, text, action) => tips.push({ pri, title, text, action: action || null });
  const mo = e => momentumOf(e), st = e => streakOf(e);
  const hot = e => mo(e) >= 65 && st(e) >= 2;
  const champIds = new Set(state.titles.filter(t => t.championId).map(t => t.championId));
  const rivalsOf = id => state.rivalries.filter(r => r.aId === id || r.bId === id);

  if(state.wrestlers.length === 0){
    add(1, 'Kezdd az adatok felvételével', 'Vegyél fel versenyzőket és öveket a Kezelés oldalon, rögzíts pár meccset, és vedd fel a rivalizálásokat — ezekből tudok tanácsot adni.');
    return tips;
  }

  // Titles
  state.titles.forEach(t => {
    const pool = t.kind === 'tag' ? state.teams : state.wrestlers;
    const champ = t.championId ? getEntity(t.championId) : null;
    const cands = pool.filter(e => !champIds.has(e.id)).sort((a, b) => mo(b) - mo(a));
    const top = cands[0];
    if(!champ){
      if(top) add(1, `${t.name}: üres cím`, `Az öv gazdátlan. A legnagyobb momentum: ${top.name} (${mo(top)}).${cands[1] ? ` Jó story: ${top.name} vs ${cands[1].name} a megüresedett övért.` : ''}`);
      return;
    }
    const days = t.since ? daysBetween(t.since) : 0;
    const defs = t.defenseCount ?? (t.defenses || []).length;
    const feud = t.feudId ? getEntity(t.feudId) : null;
    if(top && hot(top) && !(feud && feud.id === top.id)){
      add(1, `${top.name} megérdemli a címmeccset`, `${top.name} momentuma ${mo(top)}, ${st(top)} győzelem sorban. ${t.name}: ${champ.name} ${feud ? `jelenleg ${feud.name} ellen feudol` : 'mellett még nincs feud'} — ${top.name} lehetne a következő kihívó.`,
        { type: 'feud', titleId: t.id, entityId: top.id, label: `Feud: ${champ.name} vs ${top.name}` });
    } else if(!feud && top){
      add(3, `${t.name}: nincs feud`, `${champ.name}-nek nincs beállított ellenfele. Javaslat: ${top.name} (momentum ${mo(top)}).`,
        { type: 'feud', titleId: t.id, entityId: top.id, label: `Feud: ${champ.name} vs ${top.name}` });
    }
    if(feud && mo(feud) < 40 && top && mo(top) > mo(feud) + 15){
      add(2, `Gyenge kihívó: ${feud.name}`, `${feud.name} momentuma csak ${mo(feud)}, így a ${t.name} meccs kevéssé hihető. Adj neki előbb győzelmeket, vagy válts kihívót (pl. ${top.name}).`);
    }
    if(defs === 0 && days >= 14) add(2, `${champ.name}: védés nélküli uralkodás`, `${days} napja bajnok, de még nem védte meg az övet. Ideje egy védésnek${top ? ` — például ${top.name} ellen` : ''}.`);
    if(defs >= 5 && top && mo(top) >= 65) add(2, `${champ.name}: hosszú uralkodás`, `${defs} védés után ${top.name} forró formában van. Jöhet egy cím­csere vagy egy nagy lezáró meccs.`);
    if(st(champ) <= -2) add(2, `${champ.name}: vesztes széria`, `${Math.abs(st(champ))} vereség sorban a bajnoknak. Lehet a cím elvesztésének előjátéka, vagy egy „kétségek közt vergődő bajnok" story.`);
  });

  // Rivalries
  state.rivalries.forEach(r => {
    const a = getEntity(r.aId), b = getEntity(r.bId); if(!a || !b) return;
    const am = r.matches.filter(m => m.winnerId === r.aId).length;
    const bm = r.matches.filter(m => m.winnerId === r.bId).length;
    const n = am + bm, pair = `${a.name} vs ${b.name}`;
    if(n === 0 && r.heat >= 3) add(2, `${pair}: még nem volt meccs`, `Heat ${r.heat}/5, de egy rögzített meccsük sincs. Foglald le az első összecsapást, hogy a feud kapjon tétet.`);
    else if(n >= 2 && am === bm) add(1, `${pair}: döntetlen állás (${am}–${bm})`, `Itt a lezáró meccs ideje — Steel Cage, Last Man Standing vagy Ladder jó befejezést ad a feudnek.`);
    else if(n >= 3 && (am === 0 || bm === 0)){
      const win = am ? a : b, lose = am ? b : a;
      add(2, `${pair}: egyoldalú`, `${win.name} ${n}–0-ra vezet. ${lose.name}-nek kell egy győzelem vagy egy fordulat (új szövetséges, árulás), különben elfogy az izgalom.`);
    } else if(n >= 4) add(2, `${pair}: ${n} meccs`, `Hosszú rivalizálás. Zárd le egy nagy meccsel, és vidd tovább új ellenfelek felé.`);

    const ha = titlesHeld(a.id), hb = titlesHeld(b.id);
    if(ha.length && hb.length) add(2, `Bajnok vs bajnok: ${pair}`, `${a.name} (${ha[0].name}) és ${b.name} (${hb[0].name}) is övet tart. Egy unifikációs vagy Champion vs Champion meccs természetes lépés.`);

    const shared = state.teams.find(t => t.memberIds.includes(a.id) && t.memberIds.includes(b.id));
    if(shared) add(2, `Csapaton belüli feszültség: ${pair}`, `${a.name} és ${b.name} egy csapat (${shared.name}) tagjai. Klasszikus csapatszétesés-angle: árulás, majd egymás elleni feud.`);
  });

  // Individuals
  [...state.wrestlers, ...state.teams].forEach(e => {
    const rs = rivalsOf(e.id), s = st(e), isTeam = !!e.memberIds;
    if(rs.length >= 3) add(3, `${e.name}: ${rs.length} rivalizálás`, `Túl sok szál fut egyszerre. Zárj le párat, vagy vond össze őket, hogy a fő feud erősebb legyen.`);
    if(rs.length === 0 && hot(e) && !champIds.has(e.id)){
      const pool = isTeam ? state.teams : state.wrestlers;
      const opp = pool.filter(x => x.id !== e.id && !findRivalry(e.id, x.id))
        .sort((x, y) => ((champIds.has(y.id) ? 100 : 0) + mo(y)) - ((champIds.has(x.id) ? 100 : 0) + mo(x)))[0];
      add(2, `${e.name} forró, de nincs sztorija`, `Momentum ${mo(e)}, ${s} győzelem sorban, mégsincs rivalizálása.${opp ? ` Adj neki ellenfelet, például ${opp.name}-t.` : ''}`,
        opp ? { type: 'rival', aId: e.id, bId: opp.id, label: `Rivalizálás: ${e.name} vs ${opp.name}` } : null);
    }
    if(rs.length === 0 && s <= -3) add(3, `${e.name}: ${Math.abs(s)} vereség sorban`, `Comeback-story vagy heel turn jó irány lehet, hogy újra számítson.`);
  });

  if(tips.length === 0) add(3, 'Minden rendben látszik', 'Nem találtam sürgős teendőt. Rögzíts több meccset és rivalizálást, hogy pontosabb tanácsot tudjak adni.');
  return tips.sort((a, b) => a.pri - b.pri).slice(0, 15);
}

function renderAdvisor(){
  currentTips = computeTips();
  const labels = { 1: 'Fontos', 2: 'Ajánlott', 3: 'Ötlet' };
  return `<div class="note-box">A súgó <b>szabályalapú elemző</b>: az adataid (momentum, széria, feudok, rivalizálások, meccsek) alapján számol, nem mesterséges intelligencia. Minél több meccset és rivalizálást rögzítesz, annál jobb tippeket ad.</div>` +
    currentTips.map((t, i) => `<div class="tip p${t.pri}">
      <div class="tip-pri">${labels[t.pri]}</div>
      <div class="tip-title">${escapeHtml(t.title)}</div>
      <div class="tip-text">${escapeHtml(t.text)}</div>
      ${t.action ? `<button class="btn small" data-tip-act="${i}">${escapeHtml(t.action.label)}</button>` : ''}
    </div>`).join('');
}

function applyTipAction(a){
  if(a.type === 'feud'){
    const t = state.titles.find(x => x.id === a.titleId); if(!t) return;
    t.feudId = a.entityId;
    if(t.championId) ensureRivalry(t.championId, a.entityId);
  } else if(a.type === 'rival'){ ensureRivalry(a.aId, a.bId); }
  saveState(); render(); showToast('Beállítva ✓');
}

function bindTeamsStory(){
  const $$ = sel => document.querySelectorAll(sel);
  $$('[data-new-team]').forEach(b => b.onclick = () => openTeamModal(null));
  $$('[data-team-edit]').forEach(b => b.onclick = () => openTeamModal(b.dataset.teamEdit));
  $$('[data-team-del]').forEach(b => b.onclick = () => {
    if(confirm('Biztosan törlöd ezt a csapatot? A rivalizálásai is törlődnek, és ha bajnok volt, az öv üres lesz.')){
      removeTeamCascade(b.dataset.teamDel); saveState(); render();
    }
  });
  $$('[data-story-sub]').forEach(b => b.onclick = () => { storySub = b.dataset.storySub; render(); });
  $$('[data-new-rivalry]').forEach(b => b.onclick = () => openRivalryModal(null));
  $$('[data-rival-edit]').forEach(b => b.onclick = () => openRivalryModal(b.dataset.rivalEdit));
  $$('[data-rival-match]').forEach(b => b.onclick = () => openRivalMatchModal(b.dataset.rivalMatch));
  $$('[data-rival-del]').forEach(b => b.onclick = () => {
    if(confirm('Biztosan törlöd ezt a rivalizálást?')){
      state.rivalries = state.rivalries.filter(r => r.id !== b.dataset.rivalDel); saveState(); render();
    }
  });
  $$('[data-tip-act]').forEach(b => b.onclick = () => { const t = currentTips[parseInt(b.dataset.tipAct)]; if(t && t.action) applyTipAction(t.action); });
}

if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

loadState();
</script>
